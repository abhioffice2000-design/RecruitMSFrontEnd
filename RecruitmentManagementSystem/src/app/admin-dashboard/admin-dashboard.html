<div class="page-container animate-fade-in">

  <div class="page-header">
    <div>
      <h1 class="page-title">Dashboard Overview</h1>
      <p class="page-subtitle">Welcome back, here's what's happening today.</p>
    </div>
  </div>

  <div class="grid grid-cols-2 metrics-grid">
    <ng-container *ngFor="let metric of metrics">
      <div class="card metric-card glass-panel">
        <div class="metric-header">
          <div class="metric-icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="metric.icon" />
            </svg>
          </div>
          <span class="metric-trend" [class.trend-positive]="metric.isPositive"
            [class.trend-negative]="!metric.isPositive">
            {{ metric.trend }}
          </span>
        </div>
        <div class="metric-body">
          <h3>{{ metric.value }}</h3>
          <p>{{ metric.title }}</p>
        </div>
      </div>
    </ng-container>
  </div>

  <div class="grid grid-cols-3 content-grid">

    <div class="card glass-panel col-span-3">
      <div class="card-header">
        <h2>Recent Activities</h2>
        <button class="btn btn-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
          </svg>
        </button>
      </div>

      <div class="table-container mt-4">
        <table class="enterprise-table">
          <thead>
            <tr>
              <th>Candidate</th>
              <th>Role</th>
              <th>Status</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let activity of recentActivities">
              <td><strong>{{ activity.candidate }}</strong></td>
              <td>{{ activity.role }}</td>
              <td>
                <span class="badge"
                  [class.badge-success]="activity.status === 'Completed' || activity.status === 'ACTIVE'"
                  [class.badge-primary]="activity.status === 'In Progress'"
                  [class.badge-warning]="activity.status === 'Pending' || activity.status === 'Wait for response'"
                  [class.badge-danger]="activity.status === 'Closed'">
                  {{ activity.status }}
                </span>
              </td>
              <td class="text-muted">{{ activity.time }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>


  </div>

</div>
